# Reload tmux conf
bind r source-file ~/.tmux.conf \; display "Reloaded!"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -sg escape-time 10
set -g mouse on
set -g focus-events on
set-option -g history-limit 5000

bind-key -n Home send-keys "\e[H"
bind-key -n End send-keys "\e[F"

bind -T copy-mode-vi WheelUpPane send -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane send -X -N 1 scroll-down

# --- Multi-screen mouse selection fixes ---
# Enter copy mode on scroll-up WITHOUT the -e flag, so scrolling back down to
# the bottom no longer auto-exits copy mode and wipes an in-progress selection
bind -n WheelUpPane if -F "#{mouse_any_flag}" "send -M" "copy-mode -t ="
# On mouse release, copy the selection but stay in copy mode with the
# selection intact (default copy-selection-and-cancel exits + jumps to bottom)
bind -T copy-mode    MouseDragEnd1Pane send -X copy-selection-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear
# Send copies to the system clipboard via OSC 52
set -s set-clipboard on

set -g set-titles on
set -g set-titles-string '#S'

bind v split-window -hc "#{pane_current_path}"
bind s split-window -vc "#{pane_current_path}"

set -g default-terminal "xterm-256color"
#set-option -sa terminal-overrides ",xterm-kitty:RGB"
set -sg repeat-time 300

# Pane switching
bind -r i select-pane -U
bind -r k select-pane -D
bind -r j select-pane -L
bind -r l select-pane -R

# Type in all panes
bind a setw synchronize-panes

# Make the borders a little easier to see
set -g pane-active-border-style bg=default,fg=magenta
set -g pane-border-style fg=green

# Auto-name new sessions based on current directory
set-hook -g session-created 'run-shell "~/.config/tmux/rename-session.sh #{q:session_id} #{q:session_name} #{q:pane_current_path}"'
